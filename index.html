<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kryper Finance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0c0e;--pn:#141619;--pn2:#1b1e22;--ln:#272a30;--tx:#eceef1;--mu:#8b919a;--g:#4ade80;--r:#f87171;--y:#facc15;--b:#818cf8;--rad:16px}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 80% -10%,#1a1d2b55,transparent),var(--bg);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#0f1013ee;border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:4px;z-index:30;backdrop-filter:blur(14px)}
.logo{font-weight:700;font-size:17px;padding:4px 10px 18px;display:flex;gap:10px;align-items:center;letter-spacing:-.2px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--g),var(--b));display:grid;place-items:center;color:#06100a;font-style:normal;font-weight:800;font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--mu);text-decoration:none;transition:.18s}
.nav a span.i{width:20px;text-align:center}
.nav a:hover{background:var(--pn2);color:var(--tx)}
.nav a.on{background:var(--pn2);color:var(--tx);box-shadow:inset 2px 0 0 var(--g)}
.prof{display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--ln)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--g));display:grid;place-items:center;font-weight:700;color:#08090b}
.wrap{padding:24px clamp(14px,3vw,36px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(20px,3vw,28px);letter-spacing:-.5px}
.mu{color:var(--mu)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.18s}
.btn:hover{border-color:#3a3f47;transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--g);color:#06100a;border-color:var(--g);font-weight:600}
.ib{background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:8px;opacity:.7}.ib:hover{opacity:1;background:var(--pn2)}
.menu{display:none}
.card{background:linear-gradient(180deg,#171a1ecc,#121417cc);border:1px solid var(--ln);border-radius:var(--rad);padding:18px;box-shadow:0 8px 28px #0006;transition:.2s;min-width:0}
.card:hover{border-color:#343840}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px}
.big{display:block;font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.5px;margin-top:4px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.g2e{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ch{height:280px;position:relative}
.seg{display:inline-flex;background:var(--pn2);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--mu);font-size:12px}
.seg button.on{background:var(--ln);color:var(--tx)}
.ring{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .6s}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tb input,.tb select,.mb input,.mb select{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.tb input[type=search]{flex:1;min-width:160px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--rad);background:var(--pn)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--mu);font-weight:500;padding:12px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #1f2227;vertical-align:middle}
tr:hover td{background:#ffffff05}tr:last-child td{border:0}
td.act{white-space:nowrap;text-align:right}
.pill{padding:2px 10px;border-radius:20px;font-size:12px;background:#ffffff10;white-space:nowrap}
.pill.g{background:#4ade8018;color:var(--g)}.pill.r{background:#f8717118;color:var(--r)}.pill.y{background:#facc1518;color:var(--y)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.empty{text-align:center;color:var(--mu);padding:36px}
.al{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.al:last-child{border:0}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:14px}
#modal.open{display:grid}
.mb{background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto;animation:pop .2s}
.mb h3{margin-bottom:14px;font-size:17px}
.mb label{display:block;color:var(--mu);font-size:12px;margin-bottom:10px}
.mb input,.mb select{display:block;width:100%;margin-top:4px;color:var(--tx)}
.mb.wide{width:min(780px,100%)}
.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--pn2);border:1px solid var(--ln);border-left:3px solid var(--g);padding:11px 16px;border-radius:12px;animation:pop .25s;box-shadow:0 8px 24px #0008}
.sk{height:110px;border-radius:var(--rad);background:linear-gradient(90deg,var(--pn),var(--pn2),var(--pn));background-size:200%;animation:sh 1.2s infinite;margin-bottom:14px}
@keyframes sh{to{background-position:-200%}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
@media(max-width:1024px){.app{grid-template-columns:68px 1fr}.side .t,.logo b,.prof div:last-child{display:none}.nav a{justify-content:center}.g2{grid-template-columns:1fr}}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;width:240px;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.side .t,.logo b,.prof div:last-child{display:revert}.nav a{justify-content:flex-start}.menu{display:inline-block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><i>K</i><b>Kryper Finance</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="prof"><div class="av" id="av">V</div><div><b id="pn">Vitor</b><div class="mu" style="font-size:12px">Conta pessoal</div></div></div>
  </aside>
  <main class="wrap">
    <div class="tools" style="justify-content:flex-end;margin-bottom:10px">
      <button class="btn menu" data-a="menu" aria-label="Abrir menu">☰</button>
      <span style="flex:1"></span>
      <button class="btn" data-a="pdf" title="Ler um extrato bancário em PDF e importar os lançamentos">📄 Importar extrato (PDF)</button>
      <button class="btn pri" data-a="quick" title="Registrar um valor recebido ou um pagamento na hora">＋ Lançamento rápido</button>
      <button class="btn" data-a="bell" title="Alertas">🔔 <span id="bn">0</span></button>
      <button class="btn" data-a="hide" title="Ocultar ou mostrar valores" id="hb">👁 Ocultar valores</button>
    </div>
    <div id="main"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </main>
</div>
<div id="modal"><div class="mb" id="mb"></div></div>
<div id="toasts"></div>
<input type="file" id="imp" accept=".json" hidden>
<input type="file" id="pdf" accept="application/pdf" hidden>

<script>
/* ===== CONFIGURAÇÕES ===== */
const KEY='kryper-finance-v2';
const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CO=['Alimentação','Transporte','Casa','Saúde','Educação','Tecnologia','Lazer','Assinaturas','Compras','Outros'];
const CI=['Trabalho','Freelance','Extras','Empresa','Vendas','Serviços','Investimentos','Outros'];
const PAY=['Pix','Cartão de crédito','Cartão de débito','Boleto','Dinheiro','Transferência'];
const PER={Mensal:1,Trimestral:3,Semestral:6,Anual:12};
const ROUTES=[['dashboard','Dashboard','◧'],['transacoes','Transações','⇄'],['faturamento','Faturamento','↗'],['despesas','Despesas','↘'],['dividas','Dívidas','⚖'],['cartoes','Cartões','▭'],['vales','Vales','🎟'],['assinaturas','Assinaturas','↻'],['metas','Metas','◎'],['relatorios','Relatórios','▤'],['config','Configurações','⚙']];
const PC={Pago:'g',Recebido:'g','Em dia':'g',Quitada:'g',Ativa:'g',Pendente:'y','Próxima do vencimento':'y',Atrasada:'r',Pausada:''};

/* ===== FUNÇÕES ===== */
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const pd=s=>new Date(s+'T00:00:00'),mk=d=>iso(d).slice(0,7),uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dd=n=>{const d=today();d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?pd(s).toLocaleDateString('pt-BR'):'—';
const sum=(a,f=x=>x.val)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const money=v=>S.hide?'R$ ••••••':(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=(a,b)=>b>0?Math.min(100,Math.max(0,a/b*100)):0;
const mon=(v,c='')=>`<span class="${c}">${money(v)}</span>`;
const pill=s=>`<span class="pill ${PC[s]||''}">${esc(s)}</span>`;
const bar=(v,c='var(--g)')=>`<div class="bar"><i style="width:${v}%;background:${c}"></i></div>`;
const usec=v=>v>=90?'var(--r)':v>=70?'#fb923c':v>=50?'var(--y)':'var(--g)';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3000)}
function download(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

/* ===== DADOS ===== */
const blank=()=>({user:'Vitor',hide:false,demo:false,seeded:true,tx:[],debts:[],cards:[],vouchers:[],subs:[],goals:[],mg:{def:0}});
function demo(){
  const S=blank(),T=S.tx;S.demo=true;
  const o=(name,cat,val,date,pay='Pix',status='Pago')=>T.push({id:uid(),type:'out',name,cat,val,date,pay,status,note:''});
  const i=(name,party,cat,val,date,status='Recebido')=>T.push({id:uid(),type:'in',name,party,cat,val,date,status,note:''});
  for(let m=5;m>=0;m--){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()-m);const D=d=>iso(new Date(b.getFullYear(),b.getMonth(),d));
    i('Site institucional','Cliente A','Serviços',2800+(5-m)*150,D(8));i('Projeto freelance','Cliente B','Freelance',1800+(m%3)*400,D(18));
    o('Aluguel','Casa',900,D(5));o('Mercado','Alimentação',520+m*20,D(12),'Cartão de crédito');o('Transporte','Transporte',180,D(15));o('Lazer','Lazer',150+m*15,D(22),'Cartão de crédito')}
  o('Energia','Casa',210,dd(1),'Boleto','Pendente');o('Curso online','Educação',99,dd(4),'Cartão de crédito','Pendente');
  S.debts.push({id:uid(),name:'Notebook parcelado',total:4200,paid:2800,due:dd(5),parcels:12,pp:8},{id:uid(),name:'Empréstimo pessoal',total:1500,paid:300,due:dd(-3),parcels:10,pp:2});
  S.cards.push({id:uid(),name:'Nubank',bank:'Nu Pagamentos',limit:5000,used:1850,close:25,due:5,color:'#8b5cf6'},{id:uid(),name:'Inter Gold',bank:'Banco Inter',limit:3000,used:2400,close:10,due:17,color:'#f97316'});
  S.vouchers.push({id:uid(),name:'Vale-alimentação',type:'Vale-alimentação',initial:600,current:380,valid:dd(60),note:''});
  S.subs.push({id:uid(),name:'Internet',cat:'Internet',val:99.9,period:'Mensal',date:dd(2),pay:'Boleto',status:'Ativa'},{id:uid(),name:'Spotify',cat:'Streaming',val:21.9,period:'Mensal',date:dd(5),pay:'Cartão de crédito',status:'Ativa'},{id:uid(),name:'Hospedagem',cat:'Hospedagem',val:240,period:'Anual',date:dd(6),pay:'Cartão de crédito',status:'Ativa'});
  S.goals.push({id:uid(),name:'Reserva de emergência',target:10000,current:3500,deadline:dd(300),desc:'6 meses de custos'},{id:uid(),name:'Comprar computador',target:6000,current:1500,deadline:dd(150),desc:''});
  return S}

/* ===== LOCAL STORAGE ===== */
/* Dados iniciais (backup do Vitor): usados só quando o armazenamento do navegador está vazio */
const SEED={"user":"Vitor","hide":false,"demo":false,"tx":[{"id":"iwm1r85","type":"in","name":"Transferência recebida pelo Pix VITOR GOMES RODRIGUES","party":"","cat":"Outros","val":200,"date":"2026-10-05","pay":"Transferência","status":"Recebido","note":"Importado do extrato PDF"},{"id":"m45avka","type":"in","name":"Transferência recebida pelo Pix VITOR GOMES RODRIGUES","party":"","cat":"Outros","val":1980,"date":"2026-10-05","pay":"Transferência","status":"Recebido","note":"Importado do extrato PDF"},{"id":"j3y3p65","type":"out","name":"Pagamento de fatura","party":"","cat":"Outros","val":200,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"cbau1ar","type":"out","name":"Pagamento de fatura","party":"","cat":"Outros","val":9.89,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"mu747qh","type":"out","name":"Transferência enviada pelo Pix MERCADO CANTAGALO","party":"","cat":"Alimentação","val":20.25,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"r1q81nh","type":"out","name":"Pagamento de fatura","party":"","cat":"Outros","val":8.72,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"67tfud7","type":"out","name":"Transferência enviada pelo Pix MAREE INSTITUICAO DE PAGAMENTO LTDA","party":"","cat":"Outros","val":87.24,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"yugo6ec","type":"out","name":"Transferência enviada pelo Pix MAREE INSTITUICAO DE PAGAMENTO LTDA","party":"","cat":"Outros","val":151.26,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"fnv6mmb","type":"out","name":"Transferência enviada pelo Pix MAREE INSTITUICAO DE PAGAMENTO LTDA","party":"","cat":"Outros","val":162.65,"date":"2026-10-05","pay":"Transferência","status":"Pago","note":"Importado do extrato PDF"},{"id":"t3h0gbh","type":"out","name":"Compra Mensal","party":"","cat":"Alimentação","val":600,"date":"2026-08-08","pay":"Pix","status":"Pago","note":""}],"debts":[{"id":"bcclgkv","due":"2027-02-02","parcels":12,"pp":0,"name":"Maree Shopee","total":1600.18,"paid":0}],"cards":[{"id":"40fd3gg","color":"#613583","close":19,"due":0,"name":"Nu Card","bank":"Nubank","limit":210,"used":0},{"id":"r45owxe","color":"#c64600","close":26,"due":1,"name":"Shopee Parcelado","bank":"Maree Shopee","limit":2051.31,"used":0}],"vouchers":[{"id":"vof3b7e","type":"Vale-alimentação","valid":"2034-09-01","name":"Meu Alelo","initial":300,"current":273.13,"note":"O Cartão fisico vale por 5 Anos, mas pode ser cancelado apos 90 dias sem movimentação"}],"subs":[],"goals":[{"id":"8o1lim3","deadline":"2026-09-01","name":"Faturamento Max","target":3000,"current":2180,"desc":""}],"mg":{"def":0,"2026-10":3000},"seeded":true};
const isEmpty=d=>['tx','debts','cards','vouchers','subs','goals'].every(k=>!(d[k]||[]).length);
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(!d){const o=JSON.parse(localStorage.getItem('kryper-finance-v1'));if(o&&Array.isArray(o.tx)&&!o.demo)d=o}if(d&&Array.isArray(d.tx)&&!(d.seeded!==true&&isEmpty(d)))return{...blank(),...d}}catch(e){}return{...blank(),...JSON.parse(JSON.stringify(SEED))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar no navegador')}}
let S=load();save();

/* ===== CÁLCULOS ===== */
function stats(){const n=new Date(),m=mk(n),pm=mk(new Date(n.getFullYear(),n.getMonth()-1,1)),I=S.tx.filter(t=>t.type=='in'),O=S.tx.filter(t=>t.type=='out'),inM=(a,k)=>a.filter(t=>t.date.startsWith(k));
  return{m,rev:sum(inM(I,m)),prev:sum(inM(I,pm)),exp:sum(inM(O,m)),bal:sum(I.filter(t=>t.status=='Recebido'))-sum(O.filter(t=>t.status=='Pago')),goal:S.mg[m]??S.mg.def}}
const debtSt=d=>d.total-d.paid<=0?'Quitada':pd(d.due)<today()?'Atrasada':(pd(d.due)-today())/864e5<=7?'Próxima do vencimento':'Em dia';
function nextCharge(s){const d=pd(s.date),t=today(),st=PER[s.period]||1;let n=0;while(d<t&&n++<500)d.setMonth(d.getMonth()+st);return d}
const monthly=s=>s.status=='Ativa'?s.val/(PER[s.period]||1):0;
const soon=()=>S.subs.filter(s=>s.status=='Ativa'&&(nextCharge(s)-today())/864e5<=7);
function alerts(){const a=[],t=today();
  S.tx.filter(x=>x.type=='out'&&x.status=='Pendente').forEach(x=>{const d=Math.round((pd(x.date)-t)/864e5);if(d==1)a.push(['⚠️',`Conta vencendo amanhã: ${esc(x.name)}`,'y']);else if(d<0)a.push(['🔴',`Conta pendente atrasada: ${esc(x.name)}`,'r'])});
  S.cards.forEach(c=>{const u=pct(c.used,c.limit);if(u>=50)a.push([u>=90?'🔴':'⚠️',`Cartão ${esc(c.name)} ultrapassou ${u>=90?90:u>=70?70:50}% do limite`,u>=90?'r':'y'])});
  S.debts.filter(d=>debtSt(d)=='Atrasada').forEach(d=>a.push(['🔴',`Dívida atrasada: ${esc(d.name)}`,'r']));
  S.debts.filter(d=>debtSt(d)=='Próxima do vencimento').forEach(d=>a.push(['⚠️',`Dívida vence em breve: ${esc(d.name)}`,'y']));
  const st=stats();if(st.rev>=st.goal&&st.goal>0)a.push(['🟢','Meta de faturamento atingida','g']);
  S.tx.filter(x=>x.type=='in').sort((x,y)=>y.date.localeCompare(x.date)).slice(0,1).forEach(x=>a.push(['💰',`Último faturamento: ${esc(x.name)}`,'g']));
  S.subs.filter(s=>s.status=='Ativa').forEach(s=>{const d=Math.round((nextCharge(s)-t)/864e5);if(d<=7)a.push(['📅',`${esc(s.name)} será cobrada ${d==0?'hoje':'em '+d+' dia(s)'}`,'b'])});
  if(soon().length>=2)a.unshift(['📅',`Você possui ${soon().length} cobranças nos próximos 7 dias.`,'y']);
  return a}

/* ===== MODAL / FORMULÁRIOS ===== */
const closeM=()=>{$('#modal').classList.remove('open');$('#mb').classList.remove('wide')};
function form(title,fields,val,cb){
  $('#mb').innerHTML=`<h3>${title}</h3><form id="f2">${fields.map(([n,l,t,o])=>`<label>${l}${t=='select'?`<select name="${n}">${o.map(x=>`<option ${x==val[n]?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${n}" type="${t}" ${t=='number'?'step="0.01" min="0"':''} value="${esc(val[n]??'')}" ${n=='name'?'required':''}>`}</label>`).join('')}<div class="fa"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri">Salvar</button></div></form>`;
  $('#modal').classList.add('open');
  $('#f2').onsubmit=e=>{e.preventDefault();const fd2=new FormData(e.target),o={};fields.forEach(([n,,t])=>{const v=fd2.get(n);o[n]=t=='number'?(+v||0):v});cb(o)}}
function ask(msg,cb){$('#mb').innerHTML=`<h3>Confirmar</h3><p class="mu">${msg}</p><div class="fa"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" id="ok" style="background:var(--r);border-color:var(--r)">Excluir</button></div>`;$('#modal').classList.add('open');$('#ok').onclick=()=>{closeM();cb()}}
const SC={
  in:{t:'Receita',f:[['name','Descrição','text'],['party','Cliente/fonte','text'],['val','Valor (R$)','number'],['date','Data','date'],['cat','Categoria','select',CI],['status','Status','select',['Recebido','Pendente']],['note','Observação','text']],d:()=>({date:iso(new Date()),cat:CI[0],status:'Recebido'})},
  out:{t:'Despesa',f:[['name','Nome da despesa','text'],['cat','Categoria','select',CO],['val','Valor (R$)','number'],['date','Data','date'],['pay','Forma de pagamento','select',PAY],['status','Status','select',['Pago','Pendente']],['note','Observação','text']],d:()=>({date:iso(new Date()),cat:CO[0],pay:PAY[0],status:'Pago'})},
  debts:{t:'Dívida',f:[['name','Nome','text'],['total','Valor total','number'],['paid','Valor pago','number'],['due','Vencimento','date'],['parcels','Nº de parcelas','number'],['pp','Parcelas pagas','number']],d:()=>({due:dd(30),parcels:1,pp:0})},
  cards:{t:'Cartão',f:[['name','Nome do cartão','text'],['bank','Banco/instituição','text'],['limit','Limite total','number'],['used','Limite utilizado','number'],['close','Dia de fechamento','number'],['due','Dia de vencimento','number'],['color','Cor','color']],d:()=>({color:'#8b5cf6',close:25,due:5})},
  vouchers:{t:'Vale',f:[['name','Nome','text'],['type','Tipo','select',['Vale-alimentação','Vale-refeição','Vale-transporte','Crédito','Outros']],['initial','Saldo inicial','number'],['current','Saldo atual','number'],['valid','Validade','date'],['note','Observação','text']],d:()=>({type:'Vale-alimentação',valid:dd(60)})},
  subs:{t:'Assinatura',f:[['name','Nome','text'],['cat','Categoria','select',['Internet','Streaming','Música','Software','Hospedagem','Domínio','Google','Apple','Outros']],['val','Valor (R$)','number'],['period','Periodicidade','select',Object.keys(PER)],['date','Data de cobrança','date'],['pay','Forma de pagamento','select',PAY],['status','Status','select',['Ativa','Pausada']]],d:()=>({cat:'Outros',period:'Mensal',date:iso(new Date()),pay:PAY[0],status:'Ativa'})},
  goals:{t:'Meta',f:[['name','Nome','text'],['target','Valor objetivo','number'],['current','Valor atual','number'],['deadline','Prazo','date'],['desc','Descrição','text']],d:()=>({deadline:dd(180)})}};

/* ===== TRANSAÇÕES / LISTAS ===== */
const coll=k=>['all','in','out'].includes(k)?'tx':k;
const txCols=[['Data',x=>fd(x.date)],['Descrição',x=>esc(x.name)+(x.party?`<br><span class="mu">${esc(x.party)}</span>`:'')],['Categoria',x=>esc(x.cat)]];
const LV={
  transacoes:{k:'all',t:'Transações',data:()=>S.tx,cats:[...new Set([...CI,...CO])],sts:['Pago','Recebido','Pendente'],date:1,
    cols:[...txCols,['Tipo',x=>x.type=='in'?'<span class="pill g">Entrada</span>':'<span class="pill r">Saída</span>'],['Valor',x=>mon(x.val,x.type=='in'?'g':'r')],['Status',x=>pill(x.status)]],
    stat:r=>{const e=sum(r.filter(x=>x.type=='in')),s=sum(r.filter(x=>x.type=='out'));return[['Entradas',money(e),'g'],['Saídas',money(s),'r'],['Resultado',money(e-s),e-s>=0?'g':'r']]}},
  faturamento:{k:'in',t:'Faturamento',data:()=>S.tx.filter(x=>x.type=='in'),cats:CI,sts:['Recebido','Pendente'],date:1,
    cols:[...txCols,['Valor',x=>mon(x.val,'g')],['Status',x=>pill(x.status)]],
    stat:r=>{const m=stats().m;return[['Faturamento no filtro',money(sum(r)),'g'],['Faturamento do mês atual',money(sum(r.filter(x=>x.date.startsWith(m))))],['Pendente',money(sum(r.filter(x=>x.status=='Pendente'))),'y']]}},
  despesas:{k:'out',t:'Despesas',data:()=>S.tx.filter(x=>x.type=='out'),cats:CO,sts:['Pago','Pendente'],date:1,
    cols:[...txCols,['Pagamento',x=>esc(x.pay)],['Valor',x=>mon(x.val,'r')],['Status',x=>pill(x.status)]],
    stat:r=>[['Total no filtro',money(sum(r)),'r'],['Pago',money(sum(r.filter(x=>x.status=='Pago')))],['Pendente',money(sum(r.filter(x=>x.status=='Pendente'))),'y']]},
  dividas:{k:'debts',t:'Dívidas',data:()=>S.debts,sts:['Em dia','Próxima do vencimento','Atrasada','Quitada'],st:debtSt,
    cols:[['Dívida',x=>esc(x.name)],['Total',x=>money(x.total)],['Pago',x=>mon(x.paid,'g')],['Restante',x=>mon(Math.max(0,x.total-x.paid),'r')],['Vencimento',x=>fd(x.due)],['Parcelas',x=>`${x.pp}/${x.parcels}<br><span class="mu">restam ${Math.max(0,x.parcels-x.pp)}</span>`],['Progresso',x=>bar(pct(x.paid,x.total))],['Status',x=>pill(debtSt(x))]],
    stat:r=>[['Total de dívidas',money(sum(r,x=>x.total))],['Total pago',money(sum(r,x=>x.paid)),'g'],['Total restante',money(sum(r,x=>Math.max(0,x.total-x.paid))),'r']]},
  cartoes:{k:'cards',t:'Cartões',data:()=>S.cards,
    cols:[['Cartão',x=>`<span class="dot" style="background:${esc(x.color)}"></span>${esc(x.name)}<br><span class="mu">${esc(x.bank)}</span>`],['Limite',x=>money(x.limit)],['Utilizado',x=>mon(x.used,'r')],['Disponível',x=>mon(x.limit-x.used,'g')],['Uso',x=>{const u=pct(x.used,x.limit);return bar(u,usec(u))+`<span class="mu">${u.toFixed(0)}%${u>=50?' ⚠️':''}</span>`}],['Fecha / vence',x=>`dia ${x.close} / dia ${x.due}`]],
    stat:r=>[['Limite total',money(sum(r,x=>x.limit))],['Utilizado',money(sum(r,x=>x.used)),'r'],['Disponível',money(sum(r,x=>x.limit-x.used)),'g']]},
  vales:{k:'vouchers',t:'Vales & Créditos',data:()=>S.vouchers,
    cols:[['Nome',x=>esc(x.name)],['Tipo',x=>esc(x.type)],['Saldo inicial',x=>money(x.initial)],['Saldo atual',x=>mon(x.current,'g')+bar(pct(x.current,x.initial),'var(--b)')],['Validade',x=>fd(x.valid)],['Obs.',x=>esc(x.note)]],
    stat:r=>[['Saldo disponível',money(sum(r,x=>x.current)),'g'],['Saldo inicial somado',money(sum(r,x=>x.initial))],['Vales cadastrados',r.length]]},
  assinaturas:{k:'subs',t:'Assinaturas',data:()=>S.subs,sts:['Ativa','Pausada'],
    cols:[['Nome',x=>esc(x.name)],['Categoria',x=>esc(x.cat)],['Valor',x=>money(x.val)],['Periodicidade',x=>esc(x.period)],['Próxima cobrança',x=>x.status=='Ativa'?fd(iso(nextCharge(x))):'—'],['Pagamento',x=>esc(x.pay)],['Status',x=>pill(x.status)]],
    stat:r=>[['Total mensal',money(sum(r,monthly)),'b'],['Total anual estimado',money(sum(r,monthly)*12)],['Cobranças em 7 dias',soon().length,'y']]},
  metas:{k:'goals',t:'Metas financeiras',data:()=>S.goals,
    cols:[['Meta',x=>esc(x.name)+`<br><span class="mu">${esc(x.desc)}</span>`],['Objetivo',x=>money(x.target)],['Atual',x=>mon(x.current,'g')],['Progresso',x=>bar(pct(x.current,x.target),'var(--b)')+`<span class="mu">${pct(x.current,x.target).toFixed(0)}%</span>`],['Prazo',x=>fd(x.deadline)]],
    stat:r=>[['Total objetivo',money(sum(r,x=>x.target))],['Acumulado',money(sum(r,x=>x.current)),'g'],['Progresso geral',pct(sum(r,x=>x.current),sum(r,x=>x.target)).toFixed(0)+'%','b']]}};

function listView(r){const c=LV[r],sel=(id,ph,a)=>a?`<select id="${id}"><option value="">${ph}</option>${a.map(x=>`<option>${x}</option>`).join('')}</select>`:'';
  const add=r=='transacoes'?`<button class="btn pri" data-a="add" data-t="in">+ Entrada</button><button class="btn" data-a="add" data-t="out">+ Saída</button>`:`<button class="btn pri" data-a="add">+ Adicionar</button>`;
  return{h:`<div class="top"><h1>${c.t}</h1><div class="tools">${add}</div></div><div class="grid g3" id="sum"></div>
  <div class="tb"><input type="search" id="fq" placeholder="Pesquisar…" aria-label="Pesquisar">${c.date?'<input type="month" id="fmo" title="Filtrar por mês">':''}${r=='transacoes'?'<select id="ft"><option value="">Todos os tipos</option><option value="in">Entrada</option><option value="out">Saída</option></select>':''}${sel('fc','Todas as categorias',c.cats)}${sel('fs','Todos os status',c.sts)}</div>
  <div class="tw"><table><thead><tr>${c.cols.map(x=>`<th>${x[0]}</th>`).join('')}<th></th></tr></thead><tbody id="rows"></tbody></table></div>`,after:drawRows}}
function drawRows(){const c=LV[V];if(!c)return;const v=id=>$(id)?$(id).value:'',q=v('#fq').toLowerCase(),mo=v('#fmo'),cs=v('#fc'),ss=v('#fs'),ty=v('#ft');
  let r=c.data().filter(x=>(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(!mo||x.date.startsWith(mo))&&(!cs||x.cat==cs)&&(!ss||(c.st?c.st(x):x.status)==ss)&&(!ty||x.type==ty));
  if(c.date)r=[...r].sort((a,b)=>b.date.localeCompare(a.date));
  $('#sum').innerHTML=c.stat(r).map(([l,val,k])=>`<div class="card"><span class="mu">${l}</span><b class="big ${k||''}">${val}</b></div>`).join('');
  $('#rows').innerHTML=r.length?r.map(x=>`<tr>${c.cols.map(f=>`<td>${f[1](x)}</td>`).join('')}<td class="act"><button class="ib" data-a="edit" data-id="${x.id}" title="Editar" aria-label="Editar">✎</button><button class="ib" data-a="del" data-id="${x.id}" title="Excluir" aria-label="Excluir">🗑</button></td></tr>`).join(''):`<tr><td colspan="12" class="empty">Nada por aqui ainda. Use “Adicionar” para criar o primeiro registro.</td></tr>`;updBell()}
function openItem(id,t){const c=LV[V],cl=coll(c.k),item=id?S[cl].find(x=>x.id==id):null,sk=cl=='tx'?(item?item.type:(c.k=='all'?t:c.k)):c.k,sc=SC[sk];
  form((item?'Editar ':'Novo(a) ')+sc.t.toLowerCase(),sc.f,item||sc.d(),o=>{if(item)Object.assign(item,o);else S[cl].push({id:uid(),...sc.d(),...o,...(cl=='tx'?{type:sk}:{})});save();closeM();toast(`✓ ${sc.t} salvo(a) com sucesso`);refresh()})}
function delItem(id){const cl=coll(LV[V].k);ask('Excluir este registro? Essa ação não pode ser desfeita.',()=>{S[cl]=S[cl].filter(x=>x.id!=id);save();toast('✓ Registro excluído');refresh()})}

/* ===== GRÁFICOS ===== */
const CH={};let RG='6';
function chart(id,cfg){const el=document.getElementById(id);if(!el)return;if(typeof Chart=='undefined'){el.parentNode.innerHTML='<p class="empty">Gráficos indisponíveis sem conexão (Chart.js via CDN).</p>';return}
  CH[id]&&CH[id].destroy();Chart.defaults.color='#8b919a';Chart.defaults.borderColor='#272a30';cfg.options={responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label||c.label}: ${money(c.parsed.y??c.parsed)}`}}},...cfg.options};CH[id]=new Chart(el,cfg)}
function series(r){const n=new Date(),keys=[],lab=[];let fn;
  if(r=='7'||r=='m'){const N=r=='7'?7:new Date(n.getFullYear(),n.getMonth()+1,0).getDate();for(let i=0;i<N;i++){const d=r=='7'?new Date(n.getFullYear(),n.getMonth(),n.getDate()-6+i):new Date(n.getFullYear(),n.getMonth(),i+1);keys.push(iso(d));lab.push(d.getDate()+'/'+(d.getMonth()+1))}fn=t=>t.date}
  else{const N=+r;for(let i=N-1;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);keys.push(mk(d));lab.push(MN[d.getMonth()])}fn=t=>t.date.slice(0,7)}
  const a=keys.map(()=>0),b=keys.map(()=>0);S.tx.forEach(t=>{const i=keys.indexOf(fn(t));if(i>=0)(t.type=='in'?a:b)[i]+=t.val});return{lab,a,b,c:a.map((x,i)=>x-b[i])}}
function drawDash(){const s=series(RG);document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r==RG));
  chart('c1',{type:'bar',data:{labels:s.lab,datasets:[{label:'Faturamento',data:s.a,backgroundColor:'#4ade80aa',borderRadius:6},{label:'Gastos',data:s.b,backgroundColor:'#f87171aa',borderRadius:6},{type:'line',label:'Resultado líquido',data:s.c,borderColor:'#818cf8',tension:.35,pointRadius:2}]},options:{scales:{y:{ticks:{callback:v=>S.hide?'•••':v}}}}})}

function dashboard(){const st=stats(),vl=sum(S.vouchers,x=>x.current),cd=sum(S.cards,c=>Math.max(0,c.limit-c.used)),ic=S.incCard!==false,liq=st.bal+vl,tot=liq+(ic?cd:0),res=st.rev-st.exp,ch=st.prev?((st.rev-st.prev)/st.prev*100):null,gp=pct(st.rev,st.goal),n=new Date(),h=n.getHours(),
  gr=h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',ds=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),al=alerts(),last=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return{h:`<div class="top"><div><h1>${gr}, ${esc(S.user)} 👋</h1><span class="mu">${ds[0].toUpperCase()+ds.slice(1)}</span></div></div>
  <div class="grid g4">
   <div class="card"><span class="mu">Saldo atual ${ic?'(com cartões)':'(dinheiro líquido)'}</span><b class="big ${tot>=0?'':'r'}">${money(tot)}</b><div class="mu" style="font-size:12px;margin-top:6px;line-height:1.7">Conta: ${money(st.bal)}<br>Vales e créditos: ${money(vl)}<br><b style="color:var(--tx)">Dinheiro líquido: ${money(liq)}</b><br>Cartões (limite disponível): ${money(cd)}</div><button class="btn" data-a="togcard" aria-pressed="${ic}" style="margin-top:8px;padding:4px 10px;font-size:12px">${ic?'✓ Cartões no total':'Cartões fora do total'}</button></div>
   <div class="card"><span class="mu">Faturamento do mês</span><b class="big g">${money(st.rev)}</b><span class="${ch>=0?'g':'r'}" style="font-size:12px">${ch===null?'Sem mês anterior para comparar':(ch>=0?'▲ ':'▼ ')+Math.abs(ch).toFixed(1)+'% vs. mês anterior'}</span></div>
   <div class="card"><span class="mu">Gastos do mês</span><b class="big r">${money(st.exp)}</b></div>
   <div class="card"><span class="mu">Resultado líquido</span><b class="big ${res>=0?'g':'r'}">${money(res)}</b></div></div>
  <div class="grid g2"><div class="card"><h3>Meta de faturamento</h3><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="#272a30"/><circle cx="60" cy="60" r="52" stroke="${gp>=100?'#4ade80':'#818cf8'}" stroke-dasharray="${gp*3.267} 327" style="transition:.8s"/></svg>
    <div><b class="big">${gp.toFixed(0)}%</b><div class="mu">Meta: ${money(st.goal)}</div><div>Faturado: ${money(st.rev)}</div><div class="${st.goal>0&&st.rev>=st.goal?'g':'mu'}" style="margin:6px 0 10px">${st.goal<=0?'Defina sua meta mensal para acompanhar o progresso.':st.rev>=st.goal?'Meta atingida 🎉':`Faltam ${money(st.goal-st.rev)} para atingir sua meta.`}</div><button class="btn" data-a="goal">Alterar meta do mês</button></div></div></div>
   <div class="card"><h3>Evolução financeira</h3><div class="seg">${[['7','7 dias'],['m','Este mês'],['6','6 meses'],['12','12 meses']].map(([r,l])=>`<button data-a="range" data-r="${r}">${l}</button>`).join('')}</div><div class="ch"><canvas id="c1"></canvas></div></div></div>
  <div class="grid g2e"><div class="card"><h3>Alertas</h3>${al.length?al.slice(0,6).map(a=>`<div class="al"><span>${a[0]}</span><span>${a[1]}</span></div>`).join(''):'<p class="mu">Tudo em ordem por aqui.</p>'}</div>
   <div class="card"><h3>Últimas transações</h3>${last.length?last.map(x=>`<div class="al"><span style="flex:1">${esc(x.name)}<br><span class="mu">${fd(x.date)} · ${esc(x.cat)}</span></span>${mon(x.val,x.type=='in'?'g':'r')}</div>`).join(''):'<p class="mu">Nenhuma transação ainda. Registre uma receita ou despesa.</p>'}</div></div>`,after:drawDash}}

  <div class="grid g2e"><div class="card"><h3>Gastos por categoria</h3><div class="ch"><canvas id="r1"></canvas></div></div><div class="card"><h3>Faturamento × gastos mensais</h3><div class="ch"><canvas id="r2"></canvas></div></div>
  <div class="card"><h3>Evolução do saldo</h3><div class="ch"><canvas id="r3"></canvas></div></div><div class="card"><h3>Cartões e dívidas</h3>${S.cards.map(c=>`<div style="margin-bottom:10px">${esc(c.name)} <span class="mu">${pct(c.used,c.limit).toFixed(0)}%</span>${bar(pct(c.used,c.limit),usec(pct(c.used,c.limit)))}</div>`).join('')||'<p class="mu">Sem cartões.</p>'}${S.debts.map(d=>`<div style="margin-bottom:10px">${esc(d.name)} <span class="mu">${pct(d.paid,d.total).toFixed(0)}% pago</span>${bar(pct(d.paid,d.total),'var(--b)')}</div>`).join('')}</div></div>`,

    let acc=0;chart('r3',{type:'line',data:{labels:s.lab,datasets:[{label:'Saldo acumulado',data:s.c.map(v=>acc+=v),borderColor:'#818cf8',backgroundColor:'#818cf822',fill:true,tension:.35}]}})}}}

const VRE=/(-|\+)?(?:\s?R\$\s?(-)?)?(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})(?!\d)\s?([CD])?(?![A-Za-z])/g;
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let P=[];
async function loadPdfJs(){if(window.pdfjsLib)return;
  await new Promise((ok,no)=>{const x=document.createElement('script');x.src=PDFJS+'pdf.min.js';x.onload=ok;x.onerror=no;document.head.append(x)});
  const w=await(await fetch(PDFJS+'pdf.worker.min.js')).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}))}
async function pdfLines(file){await loadPdfJs();const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let n=1;n<=doc.numPages;n++){const tc=await(await doc.getPage(n)).getTextContent(),rows=[];
    tc.items.forEach(i=>{if(!i.str.trim())return;const y=Math.round(i.transform[5]/3);let r=rows.find(q=>Math.abs(q.y-y)<=1);if(!r){r={y,it:[]};rows.push(r)}r.it.push([i.transform[4],i.str])});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.it.sort((a,b)=>a[0]-b[0]).map(i=>i[1]).join(' ').replace(/\s+/g,' ').trim()))}
  return out}
function parseExtrato(lines){const yr=+((lines.join(' ').match(/\b(20\d\d)\b/)||[])[1]||new Date().getFullYear());
  const owner=/^[A-Za-zÀ-ú ]{8,60}$/.test(lines[0]||'')?lines[0].toUpperCase():'';let cur=null,sec=null;const out=[];
  for(const l of lines){
    const d=l.match(DRE);
    if(d){const dia=+(d[1]||d[4]),mes=d[2]?+d[2]:MESES[d[5].toLowerCase()],ano=d[3]?(+d[3]<100?2000+ +d[3]:+d[3]):d[6]?+d[6]:yr;
      if(mes>=1&&mes<=12&&dia>=1&&dia<=31){cur=ano+'-'+p(mes)+'-'+p(dia);if(!/total de/i.test(l))sec=null}}
    if(/total de entradas/i.test(l)){sec='in';continue}
    if(/total de sa[ií]das/i.test(l)){sec='out';continue}
    if(/saldo|total|resumo|limite|fatura anterior/i.test(l))continue;
    const vals=[...l.matchAll(VRE)];if(!vals.length||!cur)continue;
    const v=vals[0],val=parseFloat(v[3].replace(/\./g,'')+'.'+v[4]);if(!val)continue;
    const name=l.replace(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/g,' ').replace(/•+\.\d{3}\.\d{3}-•+/g,' ').replace(DRE,' ').replace(VRE,' ').replace(/R\$/g,' ')
      .replace(/\s*-\s*(BCO|CAIXA|BANCO|COOP|NU PAG|MERCADO PAGO|PAGSEGURO|PICPAY)\b.*$/i,'').replace(/\s+/g,' ').replace(/^[\s\-–·|]+|[\s\-–·|]+$/g,'');
    if(name.length<3||!/[a-zA-ZÀ-ú]{3}/.test(name))continue;
    const neg=v[1]=='-'||v[2]=='-',L=(v[5]||'').toUpperCase();
    const type=sec||(neg||L=='D'?'out':L=='C'?'in':OUTK.test(name)?'out':INK.test(name)?'in':'in');
    const cat=type=='out'?((CATM.find(c=>c[0].test(name))||[])[1]||'Outros'):'Outros';
    out.push({date:cur,name:name.slice(0,80),val,type,cat,own:!!owner&&type=='in'&&name.toUpperCase().includes(owner),dup:S.tx.some(t=>t.date==cur&&t.type==type&&Math.abs(t.val-val)<.005)})}
  return out}
function previewExtrato(){const mb=$('#mb');mb.classList.add('wide');
  mb.innerHTML=`<h3>Importar extrato</h3><p class="mu">${P.length} lançamentos encontrados. Confira o tipo (entrada ou saída) e desmarque o que não quiser importar.</p>
  <div class="tw" style="max-height:50vh;overflow:auto"><table style="min-width:520px"><thead><tr><th></th><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${P.map((x,i)=>`<tr><td><input type="checkbox" data-i="${i}" ${x.dup?'':'checked'} aria-label="Importar este lançamento"></td><td>${fd(x.date)}</td><td>${esc(x.name)}${x.dup?' <span class="pill y">possível duplicata</span>':''}${x.own?' <span class="pill">entre contas suas</span>':''}</td><td><select data-ty="${i}"><option value="in" ${x.type=='in'?'selected':''}>Entrada</option><option value="out" ${x.type=='out'?'selected':''}>Saída</option></select></td><td>${brl(x.val)}</td></tr>`).join('')}</tbody></table></div>
  <div class="fa"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="doimp">Importar selecionados</button></div>`;
  $('#modal').classList.add('open')}
function doImport(){const sel=[...document.querySelectorAll('#mb [data-i]:checked')].map(c=>P[+c.dataset.i]);
  sel.forEach(x=>S.tx.push({id:uid(),type:x.type,name:x.name,party:'',cat:x.type=='in'?'Outros':(CO.includes(x.cat)?x.cat:'Outros'),val:x.val,date:x.date,pay:'Transferência',status:x.type=='in'?'Recebido':'Pago',note:'Importado do extrato PDF'}));
  save();closeM();toast(`✓ ${sel.length} lançamento(s) importado(s) com sucesso`);render()}
$('#pdf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;toast('Lendo o extrato…');
  try{P=parseExtrato(await pdfLines(f));if(!P.length){toast('Não encontrei lançamentos nesse PDF. Ele pode ser escaneado (imagem) ou ter um formato não reconhecido.');return}previewExtrato()}
  catch(x){toast('Não foi possível ler o PDF. Verifique a conexão e se o arquivo não tem senha.')}};
document.addEventListener('change',e=>{const i=e.target.dataset&&e.target.dataset.ty;if(i!==undefined&&P[i])P[i].type=e.target.value});

/* ===== NAVEGAÇÃO / RENDER ===== */
let V='dashboard';
function render(){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==V));
  const f=V=='dashboard'?dashboard():V=='relatorios'?reports():V=='config'?settings():listView(V);
  $('#main').innerHTML=f.h;f.after&&f.after();updBell();$('#pn').textContent=S.user;$('#av').textContent=S.user[0].toUpperCase();$('#hb').textContent=S.hide?'👁 Mostrar valores':'👁 Ocultar valores'}
const refresh=()=>V=='dashboard'||!LV[V]?render():(drawRows(),updBell());
const updBell=()=>$('#bn').textContent=alerts().length;
function route(){const h=location.hash.slice(1);V=ROUTES.some(r=>r[0]==h)?h:'dashboard';$('#side').classList.remove('open');render()}
$('#nav').innerHTML=ROUTES.map(([k,l,i])=>`<a href="#${k}" data-v="${k}"><span class="i">${i}</span><span class="t">${l}</span></a>`).join('');

/* ===== EVENTOS ===== */
const ACT={
  menu:()=>$('#side').classList.toggle('open'),
  close:closeM,
  hide:()=>{S.hide=!S.hide;save();render()},
  bell:()=>{const a=alerts();$('#mb').innerHTML=`<h3>Alertas</h3>${a.length?a.map(x=>`<div class="al"><span>${x[0]}</span><span>${x[1]}</span></div>`).join(''):'<p class="mu">Nenhum alerta no momento.</p>'}<div class="fa"><button class="btn" data-a="close">Fechar</button></div>`;$('#modal').classList.add('open')},
  togcard:()=>{S.incCard=S.incCard===false;save();render()},
  pdf:()=>$('#pdf').click(),doimp:doImport,
  quick:()=>{const T=['Entrada extra (bico, rolo, venda)','Saída / pagamento'],cats=[...new Set([...CI,...CO])];
    form('Lançamento rápido',[['tipo','Tipo','select',T],['name','Descrição','text'],['val','Valor (R$)','number'],['date','Data','date'],['cat','Categoria','select',cats],['note','Observação','text']],{tipo:T[0],date:iso(new Date()),cat:'Extras'},o=>{
      const inc=o.tipo==T[0],cat=inc?(CI.includes(o.cat)?o.cat:'Extras'):(CO.includes(o.cat)?o.cat:'Outros');
      S.tx.push({id:uid(),type:inc?'in':'out',name:o.name,party:inc?'Extra':'',cat,val:o.val,date:o.date,pay:'Pix',status:inc?'Recebido':'Pago',note:o.note});
      save();closeM();toast(inc?'💰 Entrada registrada com sucesso':'✓ Pagamento registrado com sucesso');refresh()})},
  add:(e)=>openItem(null,e.dataset.t),
  edit:e=>openItem(e.dataset.id),
  del:e=>delItem(e.dataset.id),
  range:e=>{RG=e.dataset.r;drawDash()},
  goal:()=>{const m=stats().m;form('Meta de faturamento do mês',[['v','Meta de '+m,'number']],{v:S.mg[m]??S.mg.def},o=>{S.mg[m]=o.v;save();closeM();toast('✓ Meta atualizada');render()})},
  expj:()=>{download('kryper-finance.json',JSON.stringify(S,null,2),'application/json');toast('✓ Backup exportado')},
  expc:()=>{const rows=[['Data','Tipo','Descrição','Categoria','Valor','Status'],...S.tx.map(t=>[t.date,t.type=='in'?'Entrada':'Saída',t.name,t.cat,t.val,t.status])];download('transacoes.csv','\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');toast('✓ CSV exportado')},
  impt:()=>$('#imp').click(),
  clrdemo:()=>ask('Remover os dados de demonstração e começar do zero?',()=>{S={...blank(),user:S.user};save();toast('✓ Dados de demonstração removidos');render()}),
  reset:()=>ask('Apagar todos os dados deste navegador?',()=>{S={...blank(),user:S.user};save();toast('✓ Dados apagados');render()})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b);else if(e.target.id=='modal')closeM()});
document.addEventListener('input',e=>{if(LV[V]&&e.target.closest('.tb'))drawRows()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;S={...blank(),...d};save();render();toast('✓ Dados importados com sucesso')}catch(x){toast('Arquivo inválido: use um JSON exportado pelo Kryper Finance')}};r.readAsText(f);e.target.value=''};
window.addEventListener('hashchange',route);
setTimeout(route,350);
</script>
